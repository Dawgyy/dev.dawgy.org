<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Alex Gerard — IT Consultant & Developer</title>
    <meta
      name="description"
      content="Alex Gerard — IT Consultant & Developer based in Belgium. Building digital experiences with precision."
    />
    <meta property="og:title" content="Alex Gerard — IT Consultant & Developer" />
    <meta
      property="og:description"
      content="IT Consultant & Developer based in Belgium. Building digital experiences with precision."
    />
    <meta property="og:type" content="website" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (t === 'light' || (!t && !d)) {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
