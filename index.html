<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b1d20" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Alex Gerard — IT Consultant & Developer</title>
    <meta
      name="description"
      content="Alex Gerard — IT Consultant & Developer based in Belgium."
    />
    <meta
      property="og:title"
      content="Alex Gerard — IT Consultant & Developer"
    />
    <meta
      property="og:description"
      content="IT Consultant & Developer based in Belgium."
    />
    <meta property="og:type" content="website" />
    <script>
      // Dark is the default; only opt in to light.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var prefersLight = window.matchMedia(
            '(prefers-color-scheme: light)',
          ).matches;
          if (t === 'light' || (!t && prefersLight)) {
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
